<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>ScaleQL — тренажёр аналитика</title>
<meta name="description" content="Тренажёр SQL для аналитика данных: короткие уроки, задачи с автопроверкой и вопросы поверх настоящей базы.">
<link rel="icon" href="logo.svg">
<link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jetbrains-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<a class="skip-link" href="#view">Перейти к содержимому</a>

<!-- Экран первой загрузки. Нужен версии с базой в браузере:
     движок весит несколько мегабайт, и молчать эти секунды нельзя. -->
<div class="boot" id="boot" hidden>
  <div class="boot__in">
    <img class="boot__logo" src="logo.svg" alt="">
    <b class="boot__b">Scale<i>QL</i></b>
    <p class="boot__m" id="bootMsg">Загружаю движок базы…</p>
    <span class="bar bar--tall"><i id="bootBar" style="width:8%"></i></span>
  </div>
</div>

<header class="app-header">
  <button class="brand" id="brandBtn" aria-label="ScaleQL, к программе курса">
    <img src="logo.svg" alt="">
    <span>Scale<i>QL</i></span>
  </button>

  <nav class="nav" aria-label="Разделы">
    <button class="nav__item" data-view="map">Курс</button>
    <button class="nav__item" data-view="stats">Прогресс</button>
  </nav>

  <span class="spacer"></span>

  <div class="hud">
    <span class="stat stat--streak" id="hudStreak" title="Дней подряд с занятиями">
      <span data-icon="flame" data-size="15"></span><b>0</b>
      <span class="visually-hidden">дней подряд</span>
    </span>
    <span class="stat" id="hudXp" title="Накопленный опыт">
      <span data-icon="xp" data-size="15"></span><b>0</b>
      <span class="visually-hidden">очков опыта</span>
    </span>
    <button class="icon-btn" id="settingsBtn" aria-label="Настройки" title="Настройки"
      data-icon="gear" data-size="18"></button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="Разделы">
  <button class="tabbar__item" data-view="map"><span data-icon="map" data-size="19"></span>Курс</button>
  <button class="tabbar__item" data-view="stats"><span data-icon="chart" data-size="19"></span>Прогресс</button>
  <button class="tabbar__item" data-view="settings"><span data-icon="gear" data-size="19"></span>Настройки</button>
</nav>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog class="dialog" id="dialog" aria-labelledby="dialogTitle"></dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
