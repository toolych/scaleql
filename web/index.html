<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#10131c">
<title>ScaleQL — тренажёр аналитика</title>
<meta name="description" content="Тренажёр SQL для аналитика данных: короткие уроки, задачи с автопроверкой и вопросы поверх настоящей базы.">
<link rel="icon" href="logo.svg">
<link rel="preload" href="fonts/nunito-cyr.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<a class="skip-link" href="#view">Перейти к содержимому</a>

<!-- Экран первой загрузки. Нужен только версии с базой в браузере:
     движок весит несколько мегабайт, и молчать эти секунды нельзя. -->
<div class="boot" id="boot" hidden>
  <div class="boot__card">
    <img class="boot__logo" src="logo.svg" alt="">
    <b class="boot__brand">Scale<i>QL</i></b>
    <p class="boot__msg" id="bootMsg">Загружаю движок базы…</p>
    <div class="progress progress--lg boot__bar"><i class="progress__fill" id="bootBar" style="width:8%"></i></div>
  </div>
</div>

<header class="app-header">
  <button class="brand" id="brandBtn" aria-label="ScaleQL, на карту курса">
    <img src="logo.svg" alt="">
    <span>Scale<i>QL</i></span>
  </button>

  <nav class="nav" aria-label="Разделы">
    <button class="nav__item" data-view="map">Карта</button>
    <button class="nav__item" data-view="stats">Прогресс</button>
  </nav>

  <span class="spacer"></span>

  <div class="hud">
    <span class="stat stat--streak" id="hudStreak" title="Дней подряд с занятиями">
      <span aria-hidden="true">🔥</span><b>0</b><span class="visually-hidden">дней подряд</span>
    </span>
    <span class="stat stat--xp" id="hudXp" title="Накопленный опыт">
      <b>0</b><small>XP</small>
    </span>
    <button class="icon-btn" id="settingsBtn" aria-label="Настройки" title="Настройки"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 2.2v2M10 15.8v2M2.2 10h2M15.8 10h2M4.4 4.4l1.4 1.4M14.2 14.2l1.4 1.4M15.6 4.4l-1.4 1.4M5.8 14.2l-1.4 1.4"/></svg></button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="Разделы">
  <button class="tabbar__item" data-view="map"><em aria-hidden="true"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M2.6 5.4 7.4 3.4l5.2 2.2 4.8-2v11.2l-4.8 2-5.2-2.2-4.8 2z"/><path d="M7.4 3.4v13.2M12.6 5.6v13"/></svg></em>Карта</button>
  <button class="tabbar__item" data-view="stats"><em aria-hidden="true"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3.4 16.6h13.2M6 13.6V9M10 13.6V3.8M14 13.6v-3"/></svg></em>Прогресс</button>
  <button class="tabbar__item" data-view="settings"><em aria-hidden="true"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 2.2v2M10 15.8v2M2.2 10h2M15.8 10h2M4.4 4.4l1.4 1.4M14.2 14.2l1.4 1.4M15.6 4.4l-1.4 1.4M5.8 14.2l-1.4 1.4"/></svg></em>Настройки</button>
</nav>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog class="dialog" id="dialog" aria-labelledby="dialogTitle"></dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
